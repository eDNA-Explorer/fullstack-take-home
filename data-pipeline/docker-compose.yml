services:
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./samples:/app/samples
      - ./tests:/app/tests
      - ./output:/app/output
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    environment:
      - DAGSTER_HOME=/app/.dagster_home
    command: >
      sh -c "uv sync --frozen && uv run dg dev --host 0.0.0.0 --port 3000"
